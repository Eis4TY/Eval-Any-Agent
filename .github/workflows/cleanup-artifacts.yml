name: Cleanup Artifacts

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      keep_count:
        description: "保留最近多少个 tar 包 Artifact"
        required: true
        default: "20"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep latest N tar artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old tar artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = Number(core.getInput('keep_count') || '20');
            const { owner, repo } = context.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const targets = artifacts
              .filter(a => !a.expired)
              .filter(a => a.name && a.name.startsWith('eval-any-agent-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = targets.slice(keepCount);
            core.info(`Found ${targets.length} tar artifacts, keep ${keepCount}, delete ${toDelete.length}.`);

            for (const a of toDelete) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: a.id
              });
              core.info(`Deleted artifact: ${a.name} (id=${a.id})`);
            }
