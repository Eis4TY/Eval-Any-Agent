name: Package Tarball

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build tar.gz package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and package name
        id: vars
        run: |
          set -eu
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v${PKG_VERSION}-${SHORT_SHA}"
          FILE_NAME="eval-any-agent-nightly.tar.gz"
          ARTIFACT_NAME="eval-any-agent-${VERSION}.tar.gz"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_name=${FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create tar.gz from repository
        run: |
          set -eu
          git archive --format=tar.gz --prefix="Eval-Any-Agent/" --output "${{ steps.vars.outputs.file_name }}" HEAD

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ steps.vars.outputs.file_name }}
          retention-days: 30

      - name: Upload asset to Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: ${{ steps.vars.outputs.file_name }}
          overwrite_files: true
          append_body: false
          fail_on_unmatched_files: true
          body: |
            自动更新的 Nightly 手动安装包（每次 push 覆盖）。
            当前构建：`${{ steps.vars.outputs.version }}`
            提交：`${{ github.sha }}`
            
            安装示例：
            ```bash
            tar -xzf ${{ steps.vars.outputs.file_name }}
            cd Eval-Any-Agent
            ```
