name: Package Tarball

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build tar.gz package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and package name
        id: vars
        run: |
          set -eu
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v${PKG_VERSION}-${SHORT_SHA}"
          SOURCE_FILE_NAME="eval-any-agent-nightly.tar.gz"
          DOCKER_FILE_NAME="eval-any-agent-docker-nightly.tar.gz"
          ARTIFACT_NAME="eval-any-agent-${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_file_name=${SOURCE_FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "docker_file_name=${DOCKER_FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create tar.gz from repository
        run: |
          set -eu
          git archive --format=tar.gz --prefix="Eval-Any-Agent/" --output "${{ steps.vars.outputs.source_file_name }}" HEAD

      - name: Create Docker deployment package
        run: |
          set -eu
          PACKAGE_ROOT="Eval-Any-Agent-Docker"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/env" "$PACKAGE_ROOT/docker/nginx/ssl"

          cp docker-compose.release.yml "$PACKAGE_ROOT/docker-compose.yml"
          cp docker-compose.deploy.yml "$PACKAGE_ROOT/docker-compose.deploy.yml"
          cp env/.env.docker.example "$PACKAGE_ROOT/env/.env.docker.example"
          cp docker/nginx/default.conf "$PACKAGE_ROOT/docker/nginx/default.conf"
          cp docker/nginx/ssl/README.md "$PACKAGE_ROOT/docker/nginx/ssl/README.md"
          cp README.docker.md "$PACKAGE_ROOT/README.docker.md"

          tar -czf "${{ steps.vars.outputs.docker_file_name }}" "$PACKAGE_ROOT"

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: |
            ${{ steps.vars.outputs.source_file_name }}
            ${{ steps.vars.outputs.docker_file_name }}
          retention-days: 30

      - name: Upload asset to Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.vars.outputs.source_file_name }}
            ${{ steps.vars.outputs.docker_file_name }}
          overwrite_files: true
          append_body: false
          fail_on_unmatched_files: true
          body: |
            自动更新的 Nightly 安装包（每次 push 覆盖）。
            当前构建：`${{ steps.vars.outputs.version }}`
            提交：`${{ github.sha }}`
            
            Docker 部署包：
            ```bash
            tar -xzf ${{ steps.vars.outputs.docker_file_name }}
            cd Eval-Any-Agent-Docker
            cp env/.env.docker.example env/.env.docker
            docker compose --env-file env/.env.docker -f docker-compose.yml -f docker-compose.deploy.yml up -d
            ```

            源码安装包：
            ```bash
            tar -xzf ${{ steps.vars.outputs.source_file_name }}
            cd Eval-Any-Agent
            ```
